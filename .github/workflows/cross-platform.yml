name: Cross-platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and offline tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew check installDist distZip --no-daemon
      - name: Build and offline tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check installDist distZip --no-daemon
      - name: Installed launcher and SQLite smoke
        run: python scripts/smoke.py
      - name: Windows native credential store (dummy entries only)
        if: runner.os == 'Windows'
        run: .\gradlew.bat nativeStoreTest --no-daemon
      - name: Install Linux Secret Service test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Linux native credential store (isolated CI session)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euc '
            eval "$(printf "%s" "ci-only-password" | gnome-keyring-daemon --unlock --components=secrets)"
            ./gradlew nativeStoreTest --no-daemon
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            build/reports/tests/
            build/distributions/*.zip
